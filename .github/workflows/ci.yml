name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
        options: >-
          --health-cmd "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000')\" || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      WORKOS_API_KEY: ci-dummy
      AWS_REGION: ap-south-1
      DYNAMODB_TABLE_PREFIX: rm-ci-
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run test:integration

  smoke:
    # Boot probe: catches startup/build errors (missing deps, bad requires,
    # duplicated routes, broken fail-fast) that unit tests may not execute.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      WORKOS_API_KEY: ci-dummy
      AWS_REGION: ap-south-1
      DYNAMODB_TABLE_PREFIX: rm-ci-
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - name: Boot and probe
        run: |
          node src/server.js & SRV=$!
          for i in $(seq 1 20); do curl -sf http://localhost:3000/health && break || sleep 1; done
          curl -sf http://localhost:3000/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/rooms)" = "501"
          kill $SRV
          wait $SRV

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
